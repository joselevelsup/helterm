  <line x1="44" y1="76" x2="58" y2="76" stroke="#cdd6f4" stroke-width="7" stroke-linecap="round"/>
  <!-- text lines in the right pane -->
  <line x1="80" y1="46" x2="102" y2="46" stroke="#a6e3a1" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="62" x2="96" y2="62" stroke="#f5c2e7" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="78" x2="100" y2="78" stroke="#f9e2af" stroke-width="5" stroke-linecap="round"/>
</svg>
