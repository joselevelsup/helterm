# Helterm configuration, created with the defaults on first start at
# $XDG_CONFIG_HOME/helterm/config.toml (usually ~/.config/helterm/).
# Change what you like; every setting is optional and anything you delete
# goes back to its default. Restart Helterm to apply changes.

[font]
family = "JetBrainsMono Nerd Font"
size = 15

[explorer]
side = "right" # or "left": which side of its editor the file explorer opens on

# App chrome: sidebar, tabs, explorer, dialogs. Colors are "#rrggbb".
[colors.ui]
background = "#1e1e2e"
panel = "#181825"   # tab bar, explorer
sidebar = "#11111b" # workspace bar, input boxes
element = "#313244" # hover, selection, quiet borders
border = "#45475a"
text = "#cdd6f4"
muted = "#7f849c"
accent = "#89b4fa"  # focus borders, headings
error = "#f38ba8"
warning = "#f9e2af"

# What programs in the terminal see. (Helix draws with its own theme.)
[colors.terminal]
foreground = "#cdd6f4"
background = "#1e1e2e"
cursor = "#89b4fa"
selection = "#45475a" # background of selected text
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
bright_black = "#585b70"
bright_red = "#f38ba8"
bright_green = "#a6e3a1"
bright_yellow = "#f9e2af"
bright_blue = "#89b4fa"
bright_magenta = "#f5c2e7"
bright_cyan = "#94e2d5"
bright_white = "#a6adc8"

# action = "key", a list of keys, or "" to unbind. Modifiers: ctrl, alt,
# shift, super. Chords are space separated: "ctrl-k ctrl-t".
# A key belongs to one action: duplicates are reported, and a key you set
# yourself wins over a default (between two of yours, the one listed first).
[keybindings]
split_right = "alt-enter"
split_down = "alt-shift-enter"
new_editor = "alt-o"
close_container = "alt-q"
close_workspace = "alt-shift-q"
new_workspace = "alt-shift-n"
next_workspace = "alt-tab"        # COSMIC/GNOME/KDE use Alt+Tab to switch windows;
prev_workspace = "alt-shift-tab"  # free it there or pick another key here
focus_left = "alt-h"
focus_down = "alt-j"
focus_up = "alt-k"
focus_right = "alt-l"
toggle_explorer = "alt-e"
new_tab = "alt-t"
next_tab = "alt-]"
prev_tab = "alt-["
toggle_sidebar = "alt-b"
toggle_maximize = "alt-z"
manage_mode = "alt-m"      # select a container, then r: resize, m: move
toggle_floating = "alt-f"
float_focused = "alt-shift-f"
copy = "ctrl-shift-c"   # copy the selection (selecting also fills the middle-click clipboard)
paste = "ctrl-shift-v"
copy_mode = "alt-v"      # Helix keys: j/k scroll, x/v select, y copy, Esc leave
zoom_in = "alt-+"        # font size of the focused terminal
zoom_out = "alt--"
zoom_reset = "alt-0"

# Floating terminals that run a command. Press the key to open one, press it
# again to hide / show it (it keeps running); it closes when the command exits.
# Add as many as you like. Commands run through your shell, so your PATH,
# aliases and arguments work.
#
# [[floating_commands]]
# key = "alt-g"
# command = "lazygit"
#
# [[floating_commands]]
# key = "alt-y"
# command = "btop"
